name: Build and Deploy DriftLabe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set repository Pages path
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          echo "PAGES_BASE_PATH=/${repository_name}/" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ./app
        run: |
          echo "🧹 Полная очистка для исключения кэш-багов npm..."
          rm -rf node_modules package-lock.json
          
          echo "📦 Чистая установка зависимостей..."
          npm install --legacy-peer-deps
          
          echo "🛠️ Принудительная установка TypeScript и типов..."
          npm install typescript @types/node vite --save-dev --legacy-peer-deps
          
          echo "🔧 Патчу tsconfig.json..."
          sed -i '/"baseUrl":/d' tsconfig.json
          if ! grep -q '"moduleResolution"' tsconfig.json; then
            sed -i 's/"target":/"moduleResolution": "bundler",\n    "target":/' tsconfig.json
          fi
          
          echo "✅ Жёсткая проверка установки tsc..."
          if [ ! -f "./node_modules/.bin/tsc" ]; then
            echo "❌ КРИТИЧЕСКАЯ ОШИБКА: tsc НЕ установлен в node_modules/.bin!"
            ls -la ./node_modules/.bin/ || true
            exit 1
          fi
          ./node_modules/.bin/tsc --version

      - name: Build game
        working-directory: ./app
        run: |
          echo "🚀 Запускаю сборку через ПРЯМОЙ вызов бинарников (в обход npm run)..."
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          ./node_modules/.bin/vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print game link
        run: |
          echo "## DriftLabe is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the game](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
