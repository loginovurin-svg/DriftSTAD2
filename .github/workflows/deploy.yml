name: Build and Deploy DriftLabe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set repository Pages path
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          echo "PAGES_BASE_PATH=/${repository_name}/" >> "$GITHUB_ENV"

      - name: Install dependencies and fix TS config
        working-directory: ./app
        run: |
          echo "📦 Устанавливаю зависимости из package.json..."
          npm install --no-audit --no-fund
          
          echo "🛠️ Локально добавляю TypeScript и типы (избегаем конфликтов версий)..."
          npm install typescript @types/node vite --save-dev
          
          echo "🔧 Патчу tsconfig.json для совместимости с новыми версиями TS..."
          # 1. Удаляем проблемную строку с baseUrl
          sed -i '/"baseUrl":/d' tsconfig.json
          # 2. Добавляем moduleResolution: bundler (стандарт для Vite), если его нет
          if ! grep -q '"moduleResolution"' tsconfig.json; then
            sed -i 's/"target":/"moduleResolution": "bundler",\n    "target":/' tsconfig.json
          fi
          
          echo "✅ Проверка версии TS и патча:"
          npx tsc --version
          echo "--- Содержимое compilerOptions ---"
          grep -A 15 '"compilerOptions"' tsconfig.json || true

      - name: Build game
        working-directory: ./app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print game link
        run: |
          echo "## DriftLabe is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the game](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
